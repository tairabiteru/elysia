[project]
name = "elysia"
version = "0.6.0"
description = "A bot designed to nag you about chores."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "anytree>=2.13.0",
    "colorlog>=6.10.1",
    "cryptography>=46.0.3",
    "cysystemd>=2.0.1",
    "django>=6.0",
    "hikari-lightbulb>=3.2.3",
    "hikari-miru>=4.2.0",
    "hikari[speedups]>=2.5.0",
    "lolpython>=2.2.0",
    "numpy>=2.4.0",
    "orjson>=3.11.5",
    "oronyx",
    "pillow>=12.0.0",
    "plotly>=6.5.0",
    "pyfiglet>=1.0.4",
    "python-dateutil>=2.9.0.post0",
    "python-pidfile>=3.1.1",
    "setproctitle>=1.3.7",
    "toml>=0.10.2",
    "tornado>=6.5.4",
    "uvicorn>=0.40.0",
    "uvloop>=0.22.1",
]

[tool.uv.sources]
oronyx = { git = "https://github.com/tairabiteru/oronyx" }
